services:
  transaction-ledger:
    build: .
    container_name: transaction-ledger
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=transaction_ledger
      - DB_USERNAME=transaction_user
      - DB_PASSWORD=transaction_password
      - PCI_LOG_REDACTION_ENABLED=true
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - transaction-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres-db:
    image: postgres:15-alpine
    container_name: transaction-postgres
    environment:
      - POSTGRES_DB=transaction_ledger
      - POSTGRES_USER=transaction_user
      - POSTGRES_PASSWORD=transaction_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transaction-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_user"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  transaction-network:
    driver: bridge

volumes:
  postgres-data: